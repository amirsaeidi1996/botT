<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travian Bot</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#0f0f10;color:#f5f5f7}
.wrap{max-width:800px;margin:auto;padding:16px}
.card{background:#1c1c1e;border-radius:18px;padding:16px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn,input,textarea{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #444;font-size:16px;background:#111;color:#fff}
textarea{min-height:120px;font-family:ui-monospace,monospace}
.btn{border:0;font-weight:700;color:white}
.start{background:#2f7d32}.stop{background:#9f2d2d}.once{background:#3456a3}
label{display:block;margin:12px 0 5px;color:#c7c7cc}
.toggle{display:flex;gap:10px;align-items:center}.toggle input{width:auto}
.status{font-weight:800}.on{color:#61d66b}.off{color:#ff6961}
.msg{padding:10px;border-radius:10px;background:#2a2a2d;margin-bottom:12px}
.help{font-size:13px;color:#aaa;line-height:1.4}
pre{white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;background:#0a0a0a;padding:12px;border-radius:12px;font-size:12px}
a{color:#8ab4ff}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Travian Bot</h1>

{% if message %}<div class="msg">{{message}}</div>{% endif %}

<div class="card">
<div>Status: <span id="status" class="status {{'on' if running else 'off'}}">{{'RUNNING' if running else 'STOPPED'}}</span></div>
<div class="row" style="margin-top:12px">
<form method="post" action="/start"><button class="btn start">Start Bot</button></form>
<form method="post" action="/stop"><button class="btn stop">Stop Bot</button></form>
</div>
<form method="post" action="/run-once" style="margin-top:10px"><button class="btn once">Run One Cycle</button></form>
</div>

<div class="card">
<h3>Account & Automation Settings</h3>
<form method="post">

<label>Travian game-world URL</label>
<input name="server" value="{{server}}" placeholder="https://ts1.x1.international.travian.com" required>

<label>Username / email</label>
<input name="username" value="{{username}}" required>

<label>Password</label>
<input type="password" name="password" placeholder="Leave blank to keep saved password">

<label>Village ID (optional)</label>
<input name="village_id" inputmode="numeric" value="{{cfg.get('village_id') or ''}}" placeholder="Example: 12345">
<div class="help">Leave blank to use whichever village Travian selects after login.</div>

<label>Cycle interval (minutes)</label>
<input name="cycle_minutes" inputmode="decimal" value="{{cfg.get('cycle_minutes',10)}}">

<label class="toggle">
<input type="checkbox" name="dry_run" {% if cfg.get('dry_run',true) %}checked{% endif %}>
Dry run — inspect actions without clicking
</label>

<label class="toggle">
<input type="checkbox" name="build_queue_enabled" {% if cfg.get('features',{}).get('build_queue',true) %}checked{% endif %}>
Enable Build Queue
</label>

<label>Build Queue — one slot per line as SLOT:TARGET_LEVEL</label>
<textarea name="build_queue_text" placeholder="1:5&#10;2:4&#10;19:10">{{build_queue_text}}</textarea>
<div class="help">Example: <b>1:5</b> means keep trying slot 1 until it reaches level 5.</div>

<label class="toggle">
<input type="checkbox" name="one_build_per_cycle" {% if cfg.get('one_build_per_cycle',true) %}checked{% endif %}>
Only submit one construction per cycle
</label>

<label class="toggle">
<input type="checkbox" name="farm_lists_enabled" {% if cfg.get('features',{}).get('farm_lists',false) %}checked{% endif %}>
Enable Farm Lists
</label>

<label>Farm list IDs, comma separated</label>
<input name="farm_list_ids" value="{{farm_list_ids}}" placeholder="1,2,3">

<button class="btn start" style="margin-top:16px">Save Settings</button>
</form>
</div>

<div class="card">
<h3>Live Log</h3>
<pre id="logs">Loading…</pre>
</div>

<p><a href="/logout">Log out</a></p>
</div>

<script>
async function poll(){
  try{
    let r=await fetch('/api/status');
    if(!r.ok)return;
    let d=await r.json();
    let s=document.getElementById('status');
    s.textContent=d.running?'RUNNING':'STOPPED';
    s.className='status '+(d.running?'on':'off');
    document.getElementById('logs').textContent=(d.logs||[]).join('\n')||'No bot activity yet.';
  }catch(e){}
}
poll();
setInterval(poll,3000);
</script>
</body>
</html>
