<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Travian Bot</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#0f0f10;color:#f5f5f7}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#1c1c1e;border-radius:18px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #444;font-size:16px}.btn{border:0;font-weight:700;color:white}.start{background:#2f7d32}.stop{background:#9f2d2d}.farm{background:#3456a3}label{display:block;margin:10px 0 5px;color:#c7c7cc}.toggle{display:flex;gap:10px;align-items:center}.toggle input{width:auto}.status{font-weight:800}.on{color:#61d66b}.off{color:#ff6961}pre{white-space:pre-wrap;word-break:break-word;max-height:330px;overflow:auto;background:#0a0a0a;padding:12px;border-radius:12px;font-size:12px}a{color:#8ab4ff}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Travian Bot</h1><div class="card"><div>Status: <span id="status" class="status {{'on' if running else 'off'}}">{{'RUNNING' if running else 'STOPPED'}}</span></div><div class="row" style="margin-top:12px"><form method="post" action="/start"><button class="btn start">Start Bot</button></form><form method="post" action="/stop"><button class="btn stop">Stop Bot</button></form></div><form method="post" action="/farm-now" style="margin-top:10px"><button class="btn farm">Farm Now</button></form></div><div class="card"><h3>Settings</h3><form method="post"><label>Travian game-world URL</label><input name="server" value="{{server}}" placeholder="https://ts...travian.com" required><label>Username / email</label><input name="username" value="{{username}}" required><label>Password</label><input type="password" name="password" placeholder="Leave blank to keep saved password"><label>Cycle interval (minutes)</label><input name="cycle_minutes" inputmode="decimal" value="{{cfg.get('cycle_minutes',10)}}"><label>Farm list IDs, comma separated</label><input name="farm_list_ids" value="{{farm_list_ids}}" placeholder="1,2,3"><label class="toggle"><input type="checkbox" name="dry_run" {% if cfg.get('dry_run',true) %}checked{% endif %}> Dry run (recommended first)</label><label class="toggle"><input type="checkbox" name="collect_resources" {% if cfg.get('features',{}).get('collect_resources',true) %}checked{% endif %}> Read resources</label><label class="toggle"><input type="checkbox" name="build_queue" {% if cfg.get('features',{}).get('build_queue',true) %}checked{% endif %}> Build queue</label><label class="toggle"><input type="checkbox" name="farm_lists" {% if cfg.get('features',{}).get('farm_lists',false) %}checked{% endif %}> Farm lists</label><button class="btn start" style="margin-top:14px">Save Settings</button></form></div><div class="card"><h3>Live Log</h3><pre id="logs">Loading…</pre></div><p><a href="/logout">Log out</a></p></div><script>async function poll(){try{let r=await fetch('/api/status');if(!r.ok)return;let d=await r.json();let s=document.getElementById('status');s.textContent=d.running?'RUNNING':'STOPPED';s.className='status '+(d.running?'on':'off');document.getElementById('logs').textContent=(d.logs||[]).join('\n')||'No bot activity yet.';}catch(e){}}poll();setInterval(poll,3000);</script></body></html>
