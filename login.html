<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travian Bot Login</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#111;color:#eee}
.card{max-width:420px;margin:12vh auto;padding:22px;background:#1d1d1f;border-radius:18px}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:12px;border:1px solid #444;font-size:16px}
button{background:#2f7d32;color:white;font-weight:700}
.err{color:#ff8b8b}
</style>
</head>
<body>
<div class="card">
<h2>Travian Bot</h2>
<p>Enter your dashboard password.</p>
{% if error %}<p class="err">{{error}}</p>{% endif %}
<form method="post">
<input type="password" name="password" placeholder="Dashboard password" required>
<button>Sign in</button>
</form>
</div>
</body>
</html>
